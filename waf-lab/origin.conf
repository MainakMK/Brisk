# Test origin for the WAF lab: a permissive backend that returns 200 for every
# path/method (incl. /wp-login.php, /xmlrpc.php, /admin/*) and echoes the method +
# URI. The WAF/rate-limit enforcement happens at the EDGE; the origin only proves
# that an ALLOWED request actually reaches a real backend (200), and a BLOCKED one
# never does. Accepts large bodies so the body-inspect-cap test can POST a payload.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log;
    client_max_body_size 20m;

    location / {
        add_header X-Origin "waf-lab" always;
        return 200 "origin ok: $request_method $uri\n";
    }
}
