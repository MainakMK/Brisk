# Test origin for the Lua-edge lab: returns 200 for every path/method and echoes
# back (a) the X-Up request header the edge's request-transform added, via
# X-Echo-XUp, and (b) emits X-Origin-Remove so the response remove-transform can be
# observed dropping it. Redirect rules fire at the EDGE before the origin, so the
# origin never sees /old or /first.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log;
    client_max_body_size 20m;

    location / {
        add_header X-Echo-XUp $http_x_up always;          # echoes the request-transform header
        add_header X-Origin-Remove "origin-set" always;    # target of a response remove-transform
        default_type text/plain;
        return 200 "origin ok: $request_method $uri\n";
    }
}
