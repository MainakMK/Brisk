# Test origin: logs every request (so the harness can COUNT origin fetches per
# object) and serves both a dynamic cacheable object (/cold/*.css, unique per test
# so caches don't cross-contaminate) and a real Range-capable file (/clip.mp4).
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log;

    # Dynamic cacheable object — the body is small; the point is the FETCH COUNT.
    location /cold/ {
        default_type text/css;
        add_header X-Origin-Name "$hostname" always;
        return 200 "/* brisk shield lab :: origin $hostname :: $uri */\n";
    }

    # Static files (clip.mp4 for the slice/video test) — nginx serves byte ranges.
    location / {
        root /usr/share/nginx/html;
        add_header X-Origin-Name "$hostname" always;
        try_files $uri =404;
    }
}
